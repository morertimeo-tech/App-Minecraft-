<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14101f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grimoire</title>
  <meta name="apple-mobile-web-app-title" content="Grimoire" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/items/enchanted_book.png" alt="" />
    <h1 class="brand">GRI<span>MOIRE</span></h1>
    <span class="tagline">Guide de poche · Java</span>
  </header>

  <main id="app" class="screen" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="enchant" aria-selected="true">
      <img src="assets/items/enchanted_book.png" alt="" /><span>Enchants</span>
    </button>
    <button class="tab" data-tab="structures" aria-selected="false">
      <img src="assets/item-icons/ender_eye.png" alt="" /><span>Structures</span>
    </button>
    <button class="tab" data-tab="trades" aria-selected="false">
      <img src="assets/item-icons/emerald.png" alt="" /><span>Échanges</span>
    </button>
    <button class="tab" data-tab="ores" aria-selected="false">
      <img src="assets/items/diamond.png" alt="" /><span>Minerais</span>
    </button>
    <button class="tab" data-tab="trims" aria-selected="false">
      <img src="assets/items/diamond_chestplate.png" alt="" /><span>Trims</span>
    </button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/trades-data.js"></script>
  <script src="js/structures-data.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="js/trims.js"></script>
  <script src="js/stand.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
