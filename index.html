<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14101f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Enchant Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314101f'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23ffb83d'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">ENCHANT<span>LAB</span></h1>
  </header>

  <main id="app" class="screen" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="enchant" aria-selected="true">
      <img src="assets/items/enchanted_book.png" alt="" /><span>Enchantements</span>
    </button>
    <button class="tab" data-tab="ores" aria-selected="false">
      <img src="assets/items/diamond.png" alt="" /><span>Minerais</span>
    </button>
    <button class="tab" data-tab="trims" aria-selected="false">
      <img src="assets/items/diamond_chestplate.png" alt="" /><span>Trims</span>
    </button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="js/trims.js"></script>
  <script src="js/stand.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
